---
layout: default
---

<article>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}{% if page.tags and page.tags.size > 0 %} &nbsp;·&nbsp; {{ page.tags | join: ", " }}{% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>
